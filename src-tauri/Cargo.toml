[package]
name = "mavix"
version = "0.1.0"
edition = "2024"

[lib]
name = "mavix_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
portable-pty = "0.9"
base64 = "0.22"
dirs = "6"
memchr = "2"
ureq = { version = "3.5", features = ["json"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_RestartManager"] }

[profile.release]
codegen-units = 4
lto = "thin"
opt-level = 3
strip = true
